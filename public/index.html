  if(f<1)continue;
  if(me.hp>0&&Math.hypot(me.x-z.x,me.z-z.z)<1.9)takeDrop(me,d,now);
  else if(!ws&&opp.isBot&&opp.hp>0&&Math.hypot(opp.x-z.x,opp.z-z.z)<1.9){removeDrop(d.id);applyBuff(opp,z.t,now)}}
}
let buffHtml='';
function updBuffs(now){let h='';for(const k of['speed','defense','damage']){const r=me.buffs[k]-now;if(r>0)h+=`<span style="margin:0 6px;background:#0008;border-radius:8px;padding:2px 8px;color:#${BCOL[k].toString(16).padStart(6,'0')}"><img src="bonus/${k}_zone.png" width="22" style="vertical-align:middle"> ${Math.ceil(r/1000)}</span>`}
 if(h!==buffHtml){buffHtml=h;$('buffs').innerHTML=h}}
const IK=['speed','defense','damage'];
function updIcons(t,now){const m=t.mesh;if(!m.icons){m.icons={};IK.forEach(k=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:BT[k].zone,transparent:true,depthTest:false,depthWrite:false}));sp.scale.set(.95,.95,1);sp.renderOrder=11;sp.visible=false;m.add(sp);m.icons[k]=sp})}
 const act=IK.filter(k=>t.buffs[k]>now&&t.hp>0),sp=1.05;
 IK.forEach(k=>{const ic=m.icons[k];const i=act.indexOf(k);ic.visible=i>=0;if(i<0)return;const r=t.buffs[k]-now;
  ic.position.set((i-(act.length-1)/2)*sp,3.4+.08*Math.sin(now/300+i),0);
  ic.material.opacity=r<2000?(Math.sin(now/70)>0?1:.25):1})}
function updAura(t,now){const a=t.mesh.aura;if(!a)return;let r=0,g=0,b=0,n=0;for(const k in BCOL){if(t.buffs[k]>now){const c=new THREE.Color(BCOL[k]);r+=c.r;g+=c.g;b+=c.b;n++}}
 a.visible=n>0&&t.hp>0;if(n){a.material.color.setRGB(r/n,g/n,b/n);a.material.opacity=.45+.25*Math.sin(now/180)}}
function nearestDrop(o){let best=null,bd=1e9;for(const d of drops){const z=ZONES[d.zone],dd=Math.hypot(z.x-o.x,z.z-o.z);if(dd<bd&&(now0()-d.t0)>1300){bd=dd;best={x:z.x,z:z.z,d:dd}}}return best}
const now0=()=>performance.now();
let prev=performance.now(),sendT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;
 for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.t+=dt;b.m.material.opacity=Math.max(0,.9-b.t*2.5);if(b.t>.4){scene.remove(b.m);beams.splice(i,1)}}
 if(mode=='play'&&!over){
  let ix=inp.x+(keys.KeyD?1:0)-(keys.KeyA?1:0),iy=inp.y+(keys.KeyW?1:0)-(keys.KeyS?1:0);
  drive(me,ix,iy,dt,TANKS[me.type]);
  if(keys.ArrowLeft||keys.KeyZ)me.ta+=2*dt;if(keys.ArrowRight||keys.KeyX)me.ta-=2*dt;
  if(keys.KeyR||keys.ArrowUp)camPitch=Math.max(.08,camPitch-1.2*dt);if(keys.KeyF||keys.ArrowDown)camPitch=Math.min(1.25,camPitch+1.2*dt);
  const wantFire=fireReq||fireHeld||keys.Space;
  if(me.hp<=0)me.chargeT=0;
  if(me.chargeT){const f=Math.min(1,(now-me.chargeT)/CHARGE);$('rl').classList.add('ch');$('rli').style.width=f*100+'%';
   if(f>=1){me.last=now;const s=shoot(me,opp,true);if(hitCheck(s,opp))hitFx(opp,s.dx,s.dz);if(hitCheck(s,opp)&&opp.isBot){damage(opp,dmgFor(me,opp));if(opp.hp<=0){me.kills++;respawnOpp()}updHud()}}}
  else{const rl=Math.min(1,(now-me.last)/RELOAD);$('rl').classList.remove('ch');$('rli').style.width=rl*100+'%';
   if(wantFire&&rl>=1&&me.hp>0){me.chargeT=now;if(ws&&ws.readyState==1)ws.send(JSON.stringify({t:'charge'}))}}
  fireReq=false;
  if(opp.isBot)botAI(dt,now);else if(opp.tx!==undefined){opp.x+=(opp.tx-opp.x)*Math.min(1,dt*15);opp.z+=(opp.tz-opp.z)*Math.min(1,dt*15);opp.a=opp.ta2;opp.ta=opp.tta}
  sendT+=dt;if(ws&&ws.readyState==1&&sendT>.05){sendT=0;ws.send(JSON.stringify({t:'s',x:me.x,z:me.z,a:me.a,ta:me.ta,hp:me.hp}));}
  if(!opp.isBot)updHud();
 }
 if(me){for(const t of[me,opp]){const nw=performance.now();let ox=0,oz=0,ux=0,uz=0,tl=0;
  {const rc=recoil(t,nw);if(rc>0){const ax=Math.sin(t.ta),az=Math.cos(t.ta);ox-=ax*.35*rc;oz-=az*.35*rc;tl+=rc;ux+=ax*rc;uz+=az*rc}}
  {const rc=hitRec(t,nw);if(rc>0){const ax=-t.hitDx,az=-t.hitDz;ox-=ax*.3*rc;oz-=az*.3*rc;tl+=rc;ux+=ax*rc;uz+=az*rc}}
  t.mesh.position.set(t.x+ox,0,t.z+oz);t.mesh.quaternion.setFromAxisAngle(YAX,t.a);
  if(tl>0){const L=Math.hypot(ux,uz)||1,ax=ux/L,az=uz/L,ang=Math.min(tl,1.3)*.15;/* model forward=+Z; Rx(-ang) lifts +Z; axis = right of aim dir (cos,0,-sin)*/ TQ.setFromAxisAngle(TAX.set(az,0,-ax),-ang);t.mesh.quaternion.premultiply(TQ)}
  t.mesh.tur.rotation.y=t.ta-t.a;t.mesh.visible=t.hp>0}
  for(const t of[me,opp]){if(t.inv>now)t.mesh.visible=Math.floor(now/120)%2==0;else if(t.inv){t.inv=0;t.mesh.visible=true}updGlow(t,now);updAura(t,now);updIcons(t,now)}updDrops(now,dt);updBuffs(now);
  const cp=Math.cos(camPitch),sp=Math.sin(camPitch),D=9,sx=Math.sin(me.ta),sz=Math.cos(me.ta);
  cam.position.set(Math.max(-A-4,Math.min(A+4,me.x-sx*cp*D)),1.2+sp*D,Math.max(-A-4,Math.min(A+4,me.z-sz*cp*D)));{const sk=performance.now()-shakeT;if(sk<300){const a=.14*(1-sk/300)**2;cam.position.x+=(Math.random()-.5)*a;cam.position.y+=(Math.random()-.5)*a;cam.position.z+=(Math.random()-.5)*a}}cam.lookAt(me.x+sx*5,1.2,me.z+sz*5);}
 else{cam.position.set(0,25,-35);cam.lookAt(0,0,0)}
 renderer.render(scene,cam)}
requestAnimationFrame(loop);
